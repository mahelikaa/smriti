services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: smriti
      POSTGRES_PASSWORD: smriti
      POSTGRES_DB: smriti
    ports:
      - "5433:5432"
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "smriti", "-d", "smriti"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://smriti:smriti@db:5432/smriti
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "smriti.worker"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://smriti:smriti@db:5432/smriti
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
