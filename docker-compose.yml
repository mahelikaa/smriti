services:
  db:
    image: pgvector/pgvector:pg16          
    environment:
      POSTGRES_USER: smriti
      POSTGRES_PASSWORD: smriti
      POSTGRES_DB: smriti
    ports:
      - "5433:5432"
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d 
      - pgdata:/var/lib/postgresql/data 
volumes:
  pgdata: